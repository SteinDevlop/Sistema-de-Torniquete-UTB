<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reconocimiento Facial con Liveness - UTB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px 15px 0 0 !important;
            font-weight: bold;
        }
        video, canvas {
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 100%;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
        }
        .liveness-indicator {
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
            font-weight: bold;
            text-align: center;
        }
        .liveness-real {
            background-color: #d4edda;
            color: #155724;
            border: 2px solid #28a745;
        }
        .liveness-fake {
            background-color: #f8d7da;
            color: #721c24;
            border: 2px solid #dc3545;
        }
        .liveness-analyzing {
            background-color: #fff3cd;
            color: #856404;
            border: 2px solid #ffc107;
        }
        .progress {
            height: 30px;
            border-radius: 10px;
        }
        .metric-badge {
            display: inline-block;
            padding: 8px 12px;
            margin: 5px;
            border-radius: 20px;
            font-size: 0.9em;
        }
        .metric-high {
            background-color: #d4edda;
            color: #155724;
        }
        .metric-medium {
            background-color: #fff3cd;
            color: #856404;
        }
        .metric-low {
            background-color: #f8d7da;
            color: #721c24;
        }
    </style>
    <style>
        /* Diseño coherente para Liveness */
        :root{ --primary:#003366; --accent:#764ba2; }
        .card{ border-radius:16px; box-shadow:0 12px 40px rgba(2,6,23,0.06); }
        .card-header{ border-radius:16px 16px 0 0; }
        .btn-primary{ box-shadow:0 8px 30px rgba(118,75,162,0.08); }
        #livenessIndicator{ border-radius:10px; padding:12px; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center text-white mb-4">🔐 Reconocimiento Facial con Detección de Liveness</h1>
        
        <!-- Registro Facial -->
        <div class="card">
            <div class="card-header">
                📸 Registro Facial
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6">
                        <h5>Cámara en Vivo</h5>
                        <video id="videoRegister" width="100%" height="auto" autoplay></video>
                        <canvas id="canvasRegister" style="display:none;"></canvas>
                    </div>
                    <div class="col-md-6">
                        <h5>Información del Registro</h5>
                        <div class="mb-3">
                            <label class="form-label">ID de Usuario</label>
                            <input type="number" id="userIdRegister" class="form-control" placeholder="Ej: 1001">
                        </div>
                        <button class="btn btn-primary w-100" onclick="startCamera('register')">
                            📹 Activar Cámara
                        </button>
                        <button class="btn btn-success w-100 mt-2" onclick="captureAndRegister()" id="btnCapture" disabled>
                            📸 Capturar y Registrar
                        </button>
                        <div id="registerResult" class="mt-3"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Verificación con Liveness -->
        <div class="card">
            <div class="card-header">
                🎭 Verificación de Acceso con Detección de Liveness
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6">
                        <h5>Cámara en Vivo</h5>
                        <video id="videoVerify" width="100%" height="auto" autoplay></video>
                        <canvas id="canvasVerify" style="display:none;"></canvas>
                        
                        <!-- Indicador de Liveness -->
                        <div id="livenessIndicator" style="display:none;"></div>
                        
                        <!-- Progreso de captura de frames -->
                        <div id="progressContainer" style="display:none;" class="mt-3">
                            <label>Analizando frames: <span id="frameCount">0</span> / <span id="minFrames">10</span></label>
                            <div class="progress">
                                <div id="frameProgress" class="progress-bar progress-bar-striped progress-bar-animated" 
                                     role="progressbar" style="width: 0%"></div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <h5>Opciones de Verificación</h5>
                        <button class="btn btn-primary w-100" onclick="startLivenessVerification()" id="btnStartLiveness">
                            🎭 Iniciar Verificación con Liveness
                        </button>
                        <button class="btn btn-danger w-100 mt-2" onclick="stopLivenessVerification()" id="btnStopLiveness" disabled>
                            ⏹️ Detener Verificación
                        </button>
                        
                        <hr>
                        
                        <h5>Métricas de Liveness</h5>
                        <div id="livenessMetrics"></div>
                        
                        <hr>
                        
                        <h5>Resultado de Verificación</h5>
                        <div id="verifyResult"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Gestión de Registros -->
        <div class="card">
            <div class="card-header">
                📋 Gestión de Registros Biométricos
            </div>
            <div class="card-body">
                <button class="btn btn-info mb-3" onclick="loadBiometricRecords()">🔄 Actualizar Listado</button>
                <div id="biometricList"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/facial-recognition-liveness.js"></script>
</body>
</html>
