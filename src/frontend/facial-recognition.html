<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reconocimiento Facial - STUTB</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { padding: 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
    .main-container { background: white; border-radius: 15px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
    .section-card { background: #f8f9fa; border-radius: 10px; padding: 20px; margin-bottom: 20px; }
    .btn-custom { border-radius: 25px; padding: 10px 30px; font-weight: 600; }
    h1 { color: #667eea; font-weight: 700; margin-bottom: 10px; }
    h4 { color: #764ba2; font-weight: 600; margin-bottom: 15px; }
    .camera-container { position: relative; width: 100%; max-width: 640px; margin: 0 auto; }
    video, canvas { width: 100%; border-radius: 10px; border: 3px solid #667eea; }
    .result-success { background: #d4edda; border: 2px solid #28a745; border-radius: 10px; padding: 15px; margin-top: 15px; }
    .result-error { background: #f8d7da; border: 2px solid #dc3545; border-radius: 10px; padding: 15px; margin-top: 15px; }
    .result-info { background: #d1ecf1; border: 2px solid #17a2b8; border-radius: 10px; padding: 15px; margin-top: 15px; }
    #capturedImage { display: none; width: 100%; border-radius: 10px; border: 3px solid #28a745; }
  </style>
</head>
<body>
  <div class="container main-container">
    <h1 class="text-center">🔐 Reconocimiento Facial</h1>
    <p class="text-center text-muted mb-4">DeepFace + Facenet512</p>

    <!-- PASO 1: REGISTRO CON CÁMARA -->
    <div class="section-card">
      <h4>📝 Paso 1: Registrar Usuario (con Cámara)</h4>
      
      <div class="row">
        <div class="col-md-6">
          <div class="mb-3">
            <label class="form-label fw-bold">ID Usuario</label>
            <input id="regUserId" class="form-control" type="number" placeholder="Ej: 1001" value="1001">
          </div>
          <div class="mb-3">
            <button id="btnStartCamera" class="btn btn-primary btn-custom w-100">📷 Abrir Cámara</button>
            <button id="btnCapture" class="btn btn-success btn-custom w-100 mt-2 d-none">📸 Capturar Foto</button>
            <button id="btnRegister" class="btn btn-warning btn-custom w-100 mt-2 d-none">✅ Registrar Usuario</button>
          </div>
          <div id="regResult"></div>
        </div>
        <div class="col-md-6">
          <div class="camera-container">
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas" class="d-none"></canvas>
            <img id="capturedImage" alt="Foto capturada">
          </div>
        </div>
      </div>
    </div>

    <!-- PASO 2: VERIFICACIÓN CON CÁMARA O ARCHIVO -->
    <div class="section-card">
      <h4>✅ Paso 2: Verificar Acceso</h4>
      
      <div class="mb-3">
        <div class="btn-group w-100" role="group">
          <input type="radio" class="btn-check" name="verifyMode" id="modeCamera" checked>
          <label class="btn btn-outline-primary" for="modeCamera">📷 Con Cámara</label>
          
          <input type="radio" class="btn-check" name="verifyMode" id="modeFile">
          <label class="btn btn-outline-primary" for="modeFile">📁 Subir Archivo</label>
        </div>
      </div>
      
      <div class="row">
        <div class="col-md-6">
          <!-- Opción 1: Cámara -->
          <div id="cameraVerifyPanel">
            <div class="mb-3">
              <button id="btnStartCameraVerify" class="btn btn-primary btn-custom w-100">📷 Abrir Cámara</button>
              <button id="btnCaptureVerify" class="btn btn-success btn-custom w-100 mt-2 d-none">📸 Capturar Foto</button>
              <button id="btnVerify" class="btn btn-danger btn-custom w-100 mt-2 d-none">🔓 Verificar Acceso</button>
            </div>
          </div>
          
          <!-- Opción 2: Archivo -->
          <div id="fileVerifyPanel" class="d-none">
            <div class="mb-3">
              <label class="form-label fw-bold">Seleccionar Imagen</label>
              <input type="file" id="fileInput" class="form-control" accept="image/*">
              <button id="btnVerifyFile" class="btn btn-danger btn-custom w-100 mt-2">🔓 Verificar Acceso</button>
            </div>
          </div>
          
          <div id="verifyResult"></div>
        </div>
        <div class="col-md-6">
          <div class="camera-container">
            <video id="videoVerify" autoplay playsinline></video>
            <canvas id="canvasVerify" class="d-none"></canvas>
            <img id="capturedImageVerify" class="d-none" style="width: 100%; border-radius: 10px; border: 3px solid #28a745;">
            <img id="uploadedImageVerify" class="d-none" style="width: 100%; border-radius: 10px; border: 3px solid #17a2b8;">
          </div>
        </div>
      </div>
    </div>

    <!-- PASO 3: USUARIOS REGISTRADOS -->
    <div class="section-card">
      <h4>👥 Usuarios Registrados</h4>
      <button id="btnRefresh" class="btn btn-secondary btn-sm mb-3">🔄 Actualizar</button>
      <div id="usersList" style="max-height: 300px; overflow-y: auto;"></div>
    </div>
  </div>

 <script src="assets/facial-recognition.js"></script>
</body>
</html>
